; Build verification. Windows users can open DenDeco/DenDeco.ino in Arduino IDE.
[platformio]
src_dir = DenDeco
[env:esp32c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.0
monitor_speed = 115200
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.5
    bblanchon/ArduinoJson@7.4.2
